<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Les données DVF ne doivent pas être indexées par les moteurs de recherche (conditions de réutilisation). -->
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#1d4ed8">
  <title>Immodex+</title>
  <link rel="icon" href="icons/icon-small.svg" type="image/svg+xml">
  <style>
    :root { --bg: #f8fafc; --card: #ffffff; --text: #0f172a; --muted: #475569; --accent: #1d4ed8; --border: #e2e8f0; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #0b1220; --card: #111a2e; --text: #e2e8f0; --muted: #94a3b8; --accent: #60a5fa; --border: #1e293b; }
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px;
      font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); }
    main { max-width: 420px; width: 100%; background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 28px 24px; text-align: center; }
    img { width: 56px; height: 56px; }
    h1 { margin: 12px 0 4px; font-size: 22px; }
    h1 span { color: var(--accent); }
    p { margin: 8px 0 0; color: var(--muted); }
  </style>
</head>
<body>
  <main>
    <img src="icons/icon-large.svg" alt="">
    <h1>Immodex<span>+</span></h1>
    <p>L'appli téléphone arrive ici : zones, annonces suivies et ventes passées, synchronisées avec l'extension Chrome.</p>
  </main>
</body>
</html>

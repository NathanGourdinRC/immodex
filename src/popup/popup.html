<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <title>Immodex+</title>
    <script src="../ui/styles.js"></script>
  </head>
  <body class="imx-popup">
    <header class="imx-popup-header">
      <span class="imx-logo" id="logo"></span>
      <div class="imx-brand">
        <span class="imx-title">Immodex+</span>
        <span class="imx-subtitle">Adresse réelle d'une annonce immobilière</span>
      </div>
      <span class="imx-version" id="version"></span>
    </header>

    <main class="imx-popup-main">
      <div class="imx-tabs" role="tablist">
        <button type="button" id="mode-dpe" class="imx-tab is-active" role="tab">Logement</button>
        <button type="button" id="mode-land" class="imx-tab" role="tab">Terrain</button>
        <button type="button" id="mode-history" class="imx-tab" role="tab">Historique</button>
        <button type="button" id="mode-biens" class="imx-tab" role="tab">Biens</button>
        <button type="button" id="mode-sites" class="imx-tab" role="tab">Sites</button>
      </div>

      <button type="button" id="analyze-btn" class="imx-analyze" title="Lit l'annonce ouverte dans l'onglet actif et lance la recherche">
        <span class="imx-analyze-icon" id="analyze-icon"></span>
        <span class="imx-analyze-text">
          <strong>Analyser la page ouverte</strong>
          <span>Lit l'annonce de l'onglet actif et lance la recherche</span>
        </span>
      </button>

      <div id="site-bar" class="imx-site-bar imx-hidden"></div>

      <form id="dpe-form" class="imx-panel imx-form" autocomplete="off">
        <div class="imx-grid">
          <label class="imx-field"><span>Code postal</span><input class="imx-input" type="text" name="postal" maxlength="5" inputmode="numeric" placeholder="59000" /></label>
          <label class="imx-field"><span>Ville</span><input class="imx-input" type="text" name="city" placeholder="si pas de code postal" /></label>
        </div>
        <div class="imx-grid">
          <label class="imx-field"><span>Surface (m²)</span><input class="imx-input" type="number" name="surface" min="1" max="2000" placeholder="65" /></label>
          <label class="imx-field"><span>Type</span>
            <select class="imx-select" name="buildingType">
              <option value="">Indifférent</option>
              <option value="appartement">Appartement</option>
              <option value="maison">Maison</option>
            </select>
          </label>
        </div>
        <div class="imx-field"><span class="imx-field-label">Classe énergie</span><div id="energy-picker"></div></div>
        <div class="imx-field"><span class="imx-field-label">Classe GES</span><div id="ges-picker"></div></div>
        <div class="imx-grid">
          <label class="imx-field"><span>Conso (kWh/m²/an)</span><input class="imx-input" type="number" name="energyConsumption" min="0" max="2000" placeholder="facultatif" /></label>
          <label class="imx-field"><span>GES (kg CO₂/m²/an)</span><input class="imx-input" type="number" name="gesEmission" min="0" max="500" placeholder="facultatif" /></label>
        </div>
        <label class="imx-field"><span>Date du DPE</span><input class="imx-input" type="text" name="date" placeholder="JJ/MM/AAAA, MM/AAAA ou AAAA (facultatif)" /></label>
        <input type="hidden" name="energyClass" value="" />
        <input type="hidden" name="gesClass" value="" />
        <input type="hidden" name="isNewBuild" value="" />
        <input type="hidden" name="department" value="" />
        <button type="submit" id="dpe-submit" class="imx-btn imx-btn-primary imx-btn-block">Rechercher l'adresse</button>
      </form>

      <form id="land-form" class="imx-panel imx-form imx-hidden" autocomplete="off">
        <div class="imx-grid">
          <label class="imx-field"><span>Code postal</span><input class="imx-input" type="text" name="postal" maxlength="5" inputmode="numeric" placeholder="59000" /></label>
          <label class="imx-field"><span>Ville</span><input class="imx-input" type="text" name="city" placeholder="facultatif" /></label>
        </div>
        <div class="imx-grid">
          <label class="imx-field"><span>Surface du terrain (m²)</span><input class="imx-input" type="number" name="surface" min="1" max="999999" placeholder="500" /></label>
          <label class="imx-field"><span>Section cadastrale</span><input class="imx-input" type="text" name="section" maxlength="2" placeholder="facultatif" /></label>
        </div>
        <button type="submit" id="land-submit" class="imx-btn imx-btn-primary imx-btn-block">Rechercher la parcelle</button>
      </form>

      <section id="history-view" class="imx-hidden" style="display: grid; gap: 10px">
        <div id="history-list" class="imx-history"></div>
        <div class="imx-section-head">
          <small class="imx-meta">Gardé 7 jours, 50 recherches maximum.</small>
          <button type="button" id="history-clear" class="imx-btn imx-btn-sm">Tout effacer</button>
        </div>
      </section>

      <section id="biens-view" class="imx-hidden" style="display: grid; gap: 10px"></section>

      <section id="sites-view" class="imx-panel imx-hidden"></section>

      <section id="entry-bar" class="imx-section-head imx-hidden"></section>
      <section id="status" class="imx-hidden"></section>
      <section id="results"></section>
    </main>

    <footer class="imx-popup-footer">
      <a href="https://github.com/NathanGourdinRC/immodex" target="_blank" rel="noopener noreferrer">Code source</a>
      <a href="https://github.com/tonoid/immodex" target="_blank" rel="noopener noreferrer">D'après Immodex de tonoïd</a>
    </footer>

    <script src="../ui/components.js"></script>
    <script src="popup.js"></script>
  </body>
</html>

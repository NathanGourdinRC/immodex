<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <title>Immodex+ · mes recherches</title>
    <link rel="stylesheet" href="../vendor/leaflet/leaflet.css" />
    <script src="../ui/styles.js"></script>
    <style>
      html, body { height: 100%; }
      body.imx-popup.imx-dash { width: auto; display: grid; grid-template-rows: auto 1fr; }
      .imx-dash .imx-popup-header { flex-wrap: wrap; }
      .imx-dash-zones { display: flex; flex-wrap: wrap; gap: 6px; margin-left: auto; align-items: center; }
      .imx-zone-tab { height: 30px; padding: 0 12px; border: 1px solid var(--imx-border); border-radius: 999px; background: var(--imx-bg); color: var(--imx-text-2); font: 600 12.5px var(--imx-font); cursor: pointer; }
      .imx-zone-tab:hover { border-color: var(--imx-border-strong); color: var(--imx-text); }
      .imx-zone-tab.is-active { background: var(--imx-accent); border-color: var(--imx-accent); color: #fff; }
      .imx-dash-layout { display: grid; grid-template-columns: minmax(400px, 540px) 1fr; min-height: 0; }
      .imx-dash-side { display: grid; gap: 14px; align-content: start; padding: 16px; overflow-y: auto; border-right: 1px solid var(--imx-border); }
      .imx-dash-map { position: relative; min-height: 420px; }
      #map { position: absolute; inset: 0; }
      @media (min-width: 901px) { .imx-dash-layout { height: calc(100vh - 63px); } }
      @media (max-width: 900px) {
        .imx-dash-layout { grid-template-columns: 1fr; }
        .imx-dash-side { border-right: none; overflow: visible; }
        .imx-dash-map { height: 60vh; order: -1; }
      }
      .imx-kpis { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
      .imx-kpi { display: grid; gap: 2px; padding: 10px 12px; border: 1px solid var(--imx-border); border-radius: 10px; background: var(--imx-bg); }
      .imx-kpi strong { font-size: 18px; font-weight: 700; font-variant-numeric: tabular-nums; }
      .imx-kpi span { font-size: 11.5px; color: var(--imx-text-3); }
      .imx-row { display: grid; gap: 5px; padding: 11px 0; border-top: 1px solid var(--imx-border); }
      .imx-row:first-child { border-top: none; padding-top: 2px; }
      .imx-row.is-ecarte { opacity: 0.55; }
      .imx-row-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
      .imx-row-title { padding: 0; border: none; background: none; color: var(--imx-text); font: 600 13px var(--imx-font); text-align: left; cursor: pointer; }
      .imx-row-title:hover { color: var(--imx-accent); }
      .imx-tag.is-new { background: var(--imx-mid-bg); color: var(--imx-mid); border: 1px solid var(--imx-mid-line); }
      .imx-seg { display: inline-flex; gap: 2px; padding: 2px; border-radius: 8px; background: var(--imx-bg-muted); }
      .imx-seg button { height: 24px; padding: 0 8px; border: none; border-radius: 6px; background: transparent; color: var(--imx-text-2); font: 600 12px var(--imx-font); cursor: pointer; }
      .imx-seg button.is-active { background: var(--imx-bg); color: var(--imx-text); box-shadow: 0 1px 2px rgba(15, 23, 42, 0.12); }
      .imx-suggest { display: grid; border: 1px solid var(--imx-border); border-radius: var(--imx-radius-sm); overflow: hidden; }
      .imx-suggest button { padding: 8px 10px; border: none; border-top: 1px solid var(--imx-border); background: var(--imx-bg); color: var(--imx-text); font: 13px var(--imx-font); text-align: left; cursor: pointer; }
      .imx-suggest button:first-child { border-top: none; }
      .imx-suggest button:hover { background: var(--imx-accent-soft); }
      .imx-chip-remove { margin-left: 4px; padding: 0 2px; border: none; background: none; color: var(--imx-text-3); font: 700 13px var(--imx-font); cursor: pointer; }
      .imx-chip-remove:hover { color: var(--imx-low); }
      .imx-error { font-size: 12px; color: var(--imx-low); }
      .imx-note { width: 100%; min-height: 52px; padding: 7px 10px; border: 1px solid var(--imx-border-strong); border-radius: var(--imx-radius-sm); font: 12.5px var(--imx-font); color: var(--imx-text); resize: vertical; outline: none; }
      .imx-note:focus, .imx-status:focus { border-color: var(--imx-accent); box-shadow: 0 0 0 3px var(--imx-accent-line); }
      .imx-status { height: 28px; padding: 0 8px; border: 1px solid var(--imx-border-strong); border-radius: var(--imx-radius-sm); background: var(--imx-bg); font: 12px var(--imx-font); color: var(--imx-text); outline: none; }
      .imx-legend { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; font-size: 11.5px; color: var(--imx-text-2); }
      .imx-swatch { display: inline-block; width: 14px; height: 10px; margin-right: 4px; border-radius: 2px; vertical-align: -1px; }
      /* Points des biens, comme sur Airbnb : le prix dans une pastille centrée sur l'adresse ;
         survolée depuis le Fil ou bulle ouverte, elle passe en sombre et grossit. */
      .imx-price-pin-wrap { width: 0; height: 0; }
      .imx-price-pin { position: absolute; left: 0; top: 0; transform: translate(-50%, -50%); padding: 3px 8px; border: 1.5px solid #7c3aed; border-radius: 999px; background: #fff; color: #0f172a; font: 700 12px/1.2 var(--imx-font); white-space: nowrap; box-shadow: 0 1px 4px rgba(15, 23, 42, 0.35); cursor: pointer; transition: transform 0.12s, background 0.12s; }
      .imx-price-pin.is-favori { border-color: #e11d48; color: #be123c; }
      .imx-price-pin.is-ecarte { border-color: #94a3b8; color: #64748b; }
      .imx-price-pin.is-hover, .imx-price-pin.is-selected { background: #0f172a; border-color: #0f172a; color: #fff; transform: translate(-50%, -50%) scale(1.12); }
      .imx-price-pin.is-legend { position: static; display: inline-block; transform: none; margin-right: 6px; padding: 1px 6px; font-size: 11px; cursor: default; }
      .imx-map-legend { max-width: 250px; padding: 6px 9px; border-radius: 8px; background: rgba(255, 255, 255, 0.95); box-shadow: 0 1px 5px rgba(15, 23, 42, 0.3); font: 11.5px/1.5 var(--imx-font); color: var(--imx-text-2); }
      .imx-map-legend summary { cursor: pointer; font-weight: 600; color: var(--imx-text); }
      .imx-map-legend div { display: flex; align-items: center; flex-wrap: wrap; gap: 0 4px; margin-top: 3px; }
      .imx-map-legend small { display: block; margin-top: 4px; color: var(--imx-text-3); }
      .imx-legend-dot { display: inline-block; width: 10px; height: 10px; margin-right: 4px; border: 1.5px solid #fff; border-radius: 50%; box-shadow: 0 0 0 1px rgba(15, 23, 42, 0.25); }
      /* Carte du Fil reliée à un point : cliquable, mise en avant quand sa bulle est ouverte. */
      .imx-row.is-placed { cursor: pointer; }
      .imx-row.is-placed:hover { background: var(--imx-bg-muted); }
      .imx-row.is-selected { background: var(--imx-bg-muted); box-shadow: inset 3px 0 0 #0f172a; }
      .imx-row.is-placed, .imx-row.is-selected { margin: 0 -8px; padding-left: 8px; padding-right: 8px; border-radius: 6px; }
      .imx-pin-popup { display: grid; gap: 8px; }
      .imx-pin-photo { width: 100%; height: 130px; object-fit: cover; border-radius: 8px; background: var(--imx-bg-muted); }
      /* Trois vues d'une recherche : une seule visible à la fois (classe view-… sur body). */
      .imx-views { display: flex; width: 100%; }
      .imx-views button { flex: 1; height: 30px; font-size: 13px; }
      body:not(.view-fil) .imx-view-fil, body:not(.view-carte) .imx-view-carte, body:not(.view-ventes) .imx-view-ventes { display: none; }
      .imx-view { display: grid; gap: 14px; }
      .imx-bien-list.hide-ecarte .imx-bien.is-ecarte { display: none; }
      .imx-unknown { color: var(--imx-mid); }
      /* Annonces en vente (robot) : photo, étiquettes, annonces retirées atténuées. */
      .imx-annonce-photo { width: 72px; height: 54px; object-fit: cover; border-radius: 6px; flex: none; background: var(--imx-bg-muted); }
      .imx-tags { display: flex; flex-wrap: wrap; gap: 4px; }
      .imx-tags:empty { display: none; }
      .imx-tag.is-drop { background: #ecfdf3; color: #067647; border: 1px solid #abefc6; }
      .imx-tag.is-gone { background: var(--imx-bg-muted); color: var(--imx-text-3); border: 1px solid var(--imx-border); }
      .imx-annonce.is-gone { opacity: 0.6; }
      .imx-bien-list.hide-ecarte .imx-annonce.is-ecarte { display: none; }
      .imx-btn.is-active { border-color: var(--imx-accent); color: var(--imx-accent); }
      /* Secteurs : nombre de ventes au centre ; secteurs à trop peu de ventes en pointillés. */
      .imx-sector-count { display: flex; align-items: center; justify-content: center; font: 700 11px var(--imx-font); color: #0f172a; text-shadow: 0 0 3px #fff, 0 0 3px #fff; }
      .imx-sector-count.is-few { color: #64748b; font-weight: 600; }
      .imx-swatch.is-few { background: repeating-linear-gradient(45deg, #cbd5e1 0 2px, transparent 2px 4px) !important; border: 1px dashed #64748b; }
      /* Bulle d'un secteur : titre, trois repères, tableau des ventes qui défile. */
      .imx-sector-leaflet .leaflet-popup-content { margin: 14px 16px; }
      .imx-sector-popup { display: grid; gap: 10px; }
      .imx-sector-title { display: flex; align-items: center; gap: 8px; font: 700 14px var(--imx-font); color: var(--imx-text); }
      .imx-sector-dot { width: 12px; height: 12px; border-radius: 50%; flex: none; }
      .imx-sector-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
      .imx-sector-stat { display: grid; gap: 1px; padding: 6px 8px; border: 1px solid var(--imx-border); border-radius: 8px; background: var(--imx-bg-muted); }
      .imx-sector-stat strong { font-size: 14px; font-variant-numeric: tabular-nums; }
      .imx-sector-stat span { font-size: 11px; color: var(--imx-text-3); }
      .imx-sector-scroll { max-height: 300px; overflow: auto; border: 1px solid var(--imx-border); border-radius: 8px; }
      .imx-sector-table { width: 100%; border-collapse: collapse; font-size: 12px; font-variant-numeric: tabular-nums; }
      .imx-sector-table th { position: sticky; top: 0; z-index: 1; padding: 6px 8px; background: var(--imx-bg); border-bottom: 1px solid var(--imx-border-strong); color: var(--imx-text-2); font-weight: 600; text-align: left; white-space: nowrap; }
      .imx-sector-table td { padding: 5px 8px; border-bottom: 1px solid var(--imx-border); white-space: nowrap; }
      .imx-sector-table tbody tr:nth-child(even) td { background: var(--imx-bg-muted); }
      .imx-sector-table .is-num { text-align: right; }
      .imx-sector-table td:nth-child(2) { white-space: normal; min-width: 140px; }
      .imx-ppm { color: var(--imx-text-2); font-weight: 600; }
      /* Repères énergie : délai DPE → vente et prix au m² par classe. */
      .imx-energy-block { display: grid; gap: 6px; margin: 8px 0; padding: 10px 12px; border: 1px solid var(--imx-border); border-radius: 10px; background: var(--imx-bg-muted); }
      .imx-energy-classes { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; }
      .imx-energy-class { display: inline-flex; align-items: center; gap: 5px; font-size: 12.5px; font-variant-numeric: tabular-nums; }
      .imx-energy-class small { color: var(--imx-text-3); }
      .imx-energy { color: var(--imx-text-2); }
      .imx-sold { color: #067647; font-weight: 600; }
      .imx-nego { margin-top: 4px; color: var(--imx-text); font-weight: 600; }
      /* Téléphone : bulle compacte, sans les colonnes secondaires. */
      .imx-sector-popup.is-compact .col-full { display: none; }
      .imx-sector-popup.is-compact .imx-sector-stat strong { font-size: 13px; }
      .imx-sector-popup.is-compact .imx-sector-stat span { font-size: 10.5px; }
      .imx-sector-popup.is-compact .imx-sector-scroll { max-height: 200px; }
      .imx-sector-popup.is-compact .imx-sector-table td:nth-child(2) { min-width: 0; }
      /* Ventes passées : tableau qui défile à l'horizontale sur un téléphone. */
      .imx-table-wrap { overflow-x: auto; margin: 6px 0; }
      .imx-sales-table { width: 100%; border-collapse: collapse; font-size: 12px; font-variant-numeric: tabular-nums; }
      .imx-sales-table th { position: sticky; top: 0; padding: 6px; border-bottom: 1px solid var(--imx-border-strong); background: var(--imx-bg); color: var(--imx-text-2); font-weight: 600; text-align: left; white-space: nowrap; }
      .imx-sales-table td { padding: 5px 6px; border-bottom: 1px solid var(--imx-border); white-space: nowrap; }
      .imx-sales-table .is-num { text-align: right; }
      .imx-check { display: flex; align-items: center; gap: 4px; font-size: 12.5px; color: var(--imx-text-2); }
      /* Téléphone : chaque vente devient une petite carte (date et rue, puis les chiffres). */
      @media (max-width: 600px) {
        .imx-sales-table thead { display: none; }
        .imx-sales-table tr { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 12px; padding: 7px 0; border-bottom: 1px solid var(--imx-border); }
        .imx-sales-table td { padding: 0; border: none; white-space: normal; }
        .imx-sales-table td:empty { display: none; }
        .imx-sales-table td.is-street { flex: 1 1 55%; font-weight: 600; }
        .imx-sales-table td[data-label]::before { content: attr(data-label) ' '; color: var(--imx-text-3); }
        .imx-sales-table td[data-unit]::after { content: attr(data-unit); }
      }
      .imx-nearby { color: var(--imx-text); }
      /* Téléphone : la carte n'apparaît que dans la vue Carte. */
      @media (max-width: 900px) { body:not(.view-carte) .imx-dash-map { display: none; } }
      .leaflet-popup-content { margin: 12px 14px; min-width: 240px; font-family: var(--imx-font); }
      .leaflet-control-layers { font-family: var(--imx-font); font-size: 12px; }
    </style>
  </head>
  <body class="imx-popup imx-dash">
    <header class="imx-popup-header">
      <span class="imx-logo" id="logo"></span>
      <div class="imx-brand">
        <span class="imx-title">Mes recherches</span>
        <span class="imx-subtitle" id="subtitle">Mes recherches</span>
      </div>
      <nav class="imx-dash-zones" id="zone-tabs" aria-label="Recherches"></nav>
    </header>
    <div class="imx-dash-layout">
      <main class="imx-dash-side" id="side"></main>
      <section class="imx-dash-map" aria-label="Carte de la recherche"><div id="map"></div></section>
    </div>
    <script src="../vendor/leaflet/leaflet.js"></script>
    <script src="../ui/components.js"></script>
    <script src="../ui/tiles.js"></script>
    <script type="module" src="dashboard.js"></script>
  </body>
</html>
